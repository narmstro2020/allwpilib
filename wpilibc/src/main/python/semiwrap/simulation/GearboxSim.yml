classes:
  wpi::sim::GearboxSim:
    typealias:
    - wpi::math::Gearbox
    methods:
      GearboxSim:
        overloads:
          const wpi::math::LinearSystem<2, 1, 2>&, const wpi::math::Gearbox&, const std::array<double, 2>&:
            param_override:
              plant:
                x_type: wpi::math::LinearSystem<2,1,2>
      SetState:
      GetAngularPosition:
      GetAngularVelocity:
      GetCurrentDraw:
      SetInputVoltage:
      GetAngularAcceleration:
      GetTorque:
      GetInputVoltage:
      GetGearbox:
      GetJ:
      SetAngle:
      SetAngularVelocity:

inline_code: |
  cls_GearboxSim
    // java API compatibility
    .def("get_angular_position_rotations", [](const GearboxSim &self) {
      return wpi::units::turn_t{self.GetAngularPosition()};
    }, py::doc("Returns the gearbox position in rotations"))
    .def("get_angular_velocity_rpm", [](const GearboxSim &self) {
      return wpi::units::revolutions_per_minute_t{self.GetAngularVelocity()};
    }, py::doc("Returns the gearbox velocity in revolutions per minute"))
  ;
